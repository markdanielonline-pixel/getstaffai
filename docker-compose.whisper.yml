
services:
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: studio9-whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8000"
    volumes:
      - /root/studio9-production/models:/root/.cache/huggingface
    environment:
      - WHISPER__MODEL=small
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
    networks:
      - stack_default

networks:
  stack_default:
    external: true
    name: stack_default

